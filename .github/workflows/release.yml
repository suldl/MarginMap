# Builds MarginMap on Windows and uploads it to a draft GitHub release.
#
#   1. Bump "version" in package.json and commit.
#   2. git tag v0.5.1 && git push origin main --tags
#   3. When this workflow is done, open the draft release on GitHub, edit the notes, Publish.
#      Installed copies of MarginMap find the update once the release is published.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install
        run: npm ci

      # The runner's desktop is 1024x768; the tests drive a 1440x900 window.
      - name: Larger screen for the tests
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/output/*.png

      # test:e2e already ran the production build; package it. electron-builder does not upload:
      # its GitHub publisher can create several drafts for one tag when files arrive together.
      - name: Package
        run: npx electron-builder --win --publish never

      # One upload, so all four files land in the same draft release.
      - name: Upload to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          files=(
            "release/MarginMap-Setup-$version.exe"
            "release/MarginMap-Setup-$version.exe.blockmap"
            "release/latest.yml"
            "release/MarginMap-$version-portable.exe"
          )
          ls -l "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --title "MarginMap $version" --notes ""
          fi
